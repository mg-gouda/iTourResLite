# Requires: nginx ingress controller + cert-manager with a ClusterIssuer named "letsencrypt-prod"
# To check what issuers exist on the cluster:
#   kubectl get clusterissuer
# Adjust annotations if using traefik or a different ingress class.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fulvago-ingress
  namespace: fulvago
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # Route /api/ to the API pod, everything else to the web pod
    nginx.ingress.kubernetes.io/use-regex: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - fulvago.itmseg.cloud
      secretName: fulvago-tls
  rules:
    - host: fulvago.itmseg.cloud
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
