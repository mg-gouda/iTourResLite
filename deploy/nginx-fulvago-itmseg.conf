# Reverse proxy for fulvago.itmseg.cloud -> iTourResLite Docker Compose stack.
# /api/ -> api container (127.0.0.1:8011), everything else -> web (127.0.0.1:8010).
# Mirrors the routing in k8s/ingress.yaml.
# Deploy: copy to /etc/nginx/conf.d/fulvago-itmseg.conf, then `nginx -t && systemctl reload nginx`,
# then `certbot --nginx -d fulvago.itmseg.cloud` to add TLS (managed by Certbot).

server {
    listen 80;
    listen [::]:80;
    server_name fulvago.itmseg.cloud;

    client_max_body_size 50m;

    # API (path preserved: backend serves /api/v1/...)
    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web (Next.js)
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
